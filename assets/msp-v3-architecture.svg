<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="742" viewBox="0 0 1400 742" role="img" aria-labelledby="title desc"><title id="title">MSP Sentinel AI 3.1 architecture</title><desc id="desc">Separate public CTI and private Wazuh paths. Private telemetry is scoped to an authenticated tenant API and never enters the public snapshot, stream or optional AI.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#103244"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#79bed3" stroke-opacity=".055"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#58e6c2" stroke-width="1.4"/></marker></defs><rect width="1400" height="742" fill="url(#bg)"/><rect width="1400" height="742" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="58" font-size="22" fill="#58e6c2" font-weight="700">MSP SENTINEL AI 3.1</text><text x="48" y="108" font-size="39" fill="#edf7fc" font-weight="700">Two paths. An explicit data boundary.</text><rect x="48" y="142" width="1304" height="210" rx="18" fill="#091c29" stroke="#214052"/><text x="72" y="177" font-size="17" fill="#3bd7ef" font-weight="700">PUBLIC INTELLIGENCE + SYNTHETIC TENANTS</text><text x="72" y="208" font-size="18" fill="#aac2d0" font-weight="400">Existing dashboard functionality is preserved.</text><rect x="72" y="230" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="90" y="261" font-size="22" fill="#edf7fc" font-weight="700">Public CTI</text><text x="90" y="289" font-size="17" fill="#aac2d0" font-weight="400">CISA KEV · NVD</text><text x="90" y="314" font-size="17" fill="#aac2d0" font-weight="400">URLhaus · Feodo Tracker</text><path d="M366 279L387 279" stroke="#58e6c2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="392" y="230" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="410" y="261" font-size="22" fill="#edf7fc" font-weight="700">Fusion + resilience</text><text x="410" y="289" font-size="17" fill="#aac2d0" font-weight="400">Normalize · retry · fallback</text><text x="410" y="314" font-size="17" fill="#aac2d0" font-weight="400">Synthetic tenant context</text><path d="M686 279L707 279" stroke="#58e6c2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="712" y="230" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="730" y="261" font-size="22" fill="#edf7fc" font-weight="700">Public dashboard + API</text><text x="730" y="289" font-size="17" fill="#aac2d0" font-weight="400">Snapshot · exposure · SSE</text><text x="730" y="314" font-size="17" fill="#aac2d0" font-weight="400">Investigator · graph · timeline</text><path d="M1006 279L1027 279" stroke="#58e6c2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1032" y="230" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="1050" y="261" font-size="22" fill="#edf7fc" font-weight="700">Optional local AI</text><text x="1050" y="289" font-size="17" fill="#aac2d0" font-weight="400">Grounded situation brief</text><text x="1050" y="314" font-size="17" fill="#aac2d0" font-weight="400">Public / demo inputs only</text><text x="72" y="393" font-size="18" fill="#f1c879" font-weight="700">NO PRIVATE WAZUH DATA IN PUBLIC SNAPSHOTS, STREAMS OR AI</text><rect x="48" y="420" width="1304" height="210" rx="18" fill="#091c29" stroke="#214052"/><text x="72" y="455" font-size="17" fill="#58e6c2" font-weight="700">PRIVATE TELEMETRY · AUTHENTICATED TENANT API</text><text x="72" y="486" font-size="18" fill="#aac2d0" font-weight="400">A tenant token is checked before any upstream search. Connector is disabled by default.</text><rect x="72" y="508" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="90" y="539" font-size="22" fill="#edf7fc" font-weight="700">Wazuh indexer</text><text x="90" y="567" font-size="17" fill="#aac2d0" font-weight="400">Search-only credentials</text><text x="90" y="592" font-size="17" fill="#aac2d0" font-weight="400">HTTPS + trusted CA</text><path d="M366 557L387 557" stroke="#58e6c2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="392" y="508" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="410" y="539" font-size="22" fill="#edf7fc" font-weight="700">Scope + validation</text><text x="410" y="567" font-size="17" fill="#aac2d0" font-weight="400">Explicit agent allowlist</text><text x="410" y="592" font-size="17" fill="#aac2d0" font-weight="400">24 hours · up to 100 alerts</text><path d="M686 557L707 557" stroke="#58e6c2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="712" y="508" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="730" y="539" font-size="22" fill="#edf7fc" font-weight="700">Tenant-bound API</text><text x="730" y="567" font-size="17" fill="#aac2d0" font-weight="400">Token must match tenant</text><text x="730" y="592" font-size="17" fill="#aac2d0" font-weight="400">No-store · sanitized errors</text><path d="M1006 557L1027 557" stroke="#58e6c2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1032" y="508" width="290" height="98" rx="12" fill="#102a3a" stroke="#214052"/><text x="1050" y="539" font-size="22" fill="#edf7fc" font-weight="700">Authorized caller</text><text x="1050" y="567" font-size="17" fill="#aac2d0" font-weight="400">Normalized recent alerts</text><text x="1050" y="592" font-size="17" fill="#aac2d0" font-weight="400">No raw logs or shared cache</text><text x="48" y="675" font-size="20" fill="#58e6c2" font-weight="700">Synthetic checks: Python + Chromium / Firefox / WebKit</text><text x="48" y="710" font-size="20" fill="#f1c879" font-weight="400">Production isolation, live upstream permissions and deployment controls still require verification.</text></g></svg>

[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="msp-sentinel-ai"
version="0.2.0"
description="Open-source multi-tenant MSP/MSSP cyber situation room with resilient threat-intelligence fusion and optional local AI analysis."
readme="README.md"
requires-python=">=3.12"
license="MIT"
authors=[{name="Amit Ambekar"}]
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","httpx>=0.27,<1","jinja2>=3.1,<4","pydantic>=2.8,<3","pydantic-settings>=2.4,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9"]
[project.scripts]
msp-sentinel="msp_sentinel.cli:main"
[tool.pytest.ini_options]
testpaths=["tests"]
[tool.setuptools.packages.find]
include=["msp_sentinel*"]
exclude=["assets*","tests*"]

[tool.setuptools.package-data]
msp_sentinel=["templates/*.html","static/*"]
